[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-petkit"
version = "2.1.0"
description = "Local cloud replacement for PetKit litter boxes, feeders, fountains and purifiers"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "aiohttp>=3.9,<4",
    "amqtt>=0.11,<1",
    "aiomqtt>=2.0,<3",
    "cryptography>=42",
    "pyelftools>=0.30",
    # [asyncio] pulls in greenlet, which SQLAlchemy's async engine needs to
    # bridge its synchronous internals — without it every await raises.
    "SQLAlchemy[asyncio]>=2.0,<3",
    # The IANA zone database as a package: `zoneinfo` otherwise relies on the
    # OS copy, which slim and musl images and some CI runners do not ship.
    "tzdata>=2024.1",
    "aiosqlite>=0.19",
    "Jinja2>=3.1",
    "aiohttp-jinja2>=1.6",
    # argon2id for the user-plane admin password (features/auth/passwords.py).
    "argon2-cffi>=23.1",
    # Request schemas on the user plane. Chosen over msgspec and hand-written
    # validators because it is the one with binary wheels for every image
    # target; the evidence is in docs/code-standards.md.
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff==0.17.3",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "hypothesis>=6.100",
    "import-linter>=2.1",
]

[project.urls]
Homepage = "https://github.com/ngocsangyem/my-petkit"
Upstream = "https://github.com/alex-so-3/petkit-local"

[project.scripts]
my-petkit = "my_petkit.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["my_petkit*"]

# The web panel ships its own template/static assets; without this they are
# dropped from wheels/sdists (the Docker image copies the tree verbatim, so
# only pip installs are affected).
[tool.setuptools.package-data]
# `static/*` does not match `static/bin/dropbear-mipsel`: a glob segment does
# not cross a directory boundary. Without the second entry a pip-installed
# copy ships no dropbear and the ssh patcher fails at open(). The Docker
# image copies the tree verbatim, which is why this stayed hidden. Same reason
# for `static/js/*`: the panel is a graph of ES modules under that directory,
# and without it a pip-installed copy serves an index whose only script 404s.
"my_petkit.web" = ["templates/*.html", "static/*", "static/bin/*", "static/js/*"]

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
# Tests are plain `async def test_*` functions with no decorator; auto mode is
# what lets pytest-asyncio run them (and the async fixtures in conftest.py)
# without every test file importing pytest.
asyncio_mode = "auto"
markers = [
    "firmware: tests against real device firmware (skipped without --firmware)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. This is a lint gate against real defects — an unused
# import, an undefined name, a shadowed builtin that changes behaviour — not a
# style enforcer; the house style is CONTRIBUTING.md's and is applied by review.
# PLC0415 (import not at top of file) earns its place on the same footing: a
# lazy import reads as a claim that the module is expensive or cyclic, and in
# this codebase it never is except where a `# noqa: PLC0415` says which cycle
# it breaks.
# S (flake8-bandit) and ASYNC are added on top of the upstream gate. Hits that
# already exist in the ported code are counted per file and rule in
# ruff-baseline.txt, with the reason for each group; CI
# (scripts/lint-baseline-gate.py) fails when any count grows, so the ported code
# is not reformatted or noqa-littered and new code gets no pass.
#
# New user-plane code is held to the extended set from docs/code-standards.md
# (E, W, UP, SIM, RUF, PL, PT, BLE, TRY on top of the above). It is selected
# for everything and then ignored for everything that is NOT new code, through
# the negated pattern under per-file-ignores: ruff cannot select per path, and
# this keeps the ported code exactly as it was. `PLC` stays at PLC0415 and `E`
# keeps E9 for the ported code, because those were already its gate.
select = [
    "F", "E9", "B", "PLC0415", "S", "ASYNC",
    "E4", "E5", "E7", "W", "UP", "SIM", "RUF", "PLE", "PLR", "PLW", "PT", "BLE", "TRY",
]
ignore = [
    # `raise ... from err` inside an except block. The codebase deliberately
    # swallows and re-reports device-facing failures rather than chaining.
    "B904",
    # A message naming the file or value that failed IS the useful part of a
    # ValueError here; one exception class per message would add nothing.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests shadow fixtures and build deliberately odd inputs. They also import
# inside the test body on purpose: the import is part of what the test pins,
# and keeping it next to the assertion is what makes a one-symbol regression
# readable — so PLC0415 is a production rule only.
"tests/*" = ["F811", "B011", "PLC0415", "S101", "S105", "S106", "S108", "S311", "ASYNC230", "ASYNC240"]
# Everything outside the new-code paths keeps the narrow gate above.
"!src/my_petkit/{features/auth/**,shared/errors.py,shared/redact_client.py,shared/request_auth.py,shared/tiers.py,utils/user_tls.py}" = [
    "E4", "E5", "E7", "W", "UP", "SIM", "RUF", "PLE", "PLR", "PLW", "PT", "BLE", "TRY",
]

[tool.ruff.lint.pylint]
# Route handlers and the middleware read several request facts in sequence;
# six returns is where a split starts costing more than it saves.
max-returns = 8

# mypy --strict for the new user-plane code. `strict` itself is not a
# per-module option, so its component flags are listed. The ported code keeps
# plain mypy against mypy-baseline.txt (scripts/lint-baseline-gate.py).
[[tool.mypy.overrides]]
module = [
    "my_petkit.features.auth.*",
    "my_petkit.shared.errors",
    "my_petkit.shared.redact_client",
    "my_petkit.shared.request_auth",
    "my_petkit.shared.tiers",
    "my_petkit.utils.user_tls",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
