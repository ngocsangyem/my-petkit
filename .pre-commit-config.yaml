# Every hook is pinned to a commit SHA, not a tag: a tag can be moved to new
# code by whoever controls the hook repository, and that code then runs on a
# contributor's machine. To update, resolve the tag yourself:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  # Ruff runs through the baseline gate: the ported code carries counted,
  # justified hits (services/api/ruff-baseline.txt) and plain `ruff check`
  # would fail on them. The gate fails only on hits beyond that baseline.
  - repo: local
    hooks:
      - id: ruff-baseline-gate
        name: ruff (baseline gate)
        language: python
        additional_dependencies: ["ruff==0.17.3"]
        entry: bash -c 'cd services/api && python ../../scripts/lint-baseline-gate.py ruff ruff ruff-baseline.txt src tests'
        pass_filenames: false
        files: ^services/api/

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # v3.9.10
    hooks:
      - id: prettier
        files: ^apps/web/src/.*\.(ts|tsx|css|json)$
