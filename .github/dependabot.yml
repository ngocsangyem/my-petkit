version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /apps/ios/PetkitKit
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The Caddy image the VPS compose file pins by digest.
  - package-ecosystem: docker-compose
    directory: /deploy/cloud
    schedule:
      interval: weekly
