version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /apps/ios/PetkitKit
    schedule:
      interval: weekly
    ignore:
      # 1.14 needs Swift tools 6.2; the macos-15 runners build with Xcode 16.4
      # (Swift 6.1). Lift this when CI moves to Xcode 26.
      - dependency-name: github.com/apple/swift-openapi-generator
        versions: [">= 1.14.0"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The Caddy image the VPS compose file pins by digest.
  - package-ecosystem: docker-compose
    directory: /deploy/cloud
    schedule:
      interval: weekly
