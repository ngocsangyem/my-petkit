name: contracts

# The user-plane OpenAPI contract and the clients generated from it.
#
# - The committed TypeScript types and the iOS copy of the spec must be what
#   scripts/gen-clients.sh produces from packages/contracts/openapi.yaml.
# - The Swift client is generated by a build plugin, so `swift build` is its gate.
#
# That the spec matches the router is checked by api-tests
# (tests/test_contract_spec_paths_exist.py), not here.
#
# Third-party actions are pinned to a commit SHA. To update one, resolve the
# tag yourself: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  push:
    paths:
      - packages/contracts/**
      - apps/web/src/api/**
      - apps/ios/PetkitKit/**
      - scripts/gen-clients.sh
      - .github/workflows/contracts.yml
  pull_request:
    paths:
      - packages/contracts/**
      - apps/web/src/api/**
      - apps/ios/PetkitKit/**
      - scripts/gen-clients.sh
      - .github/workflows/contracts.yml
  workflow_call:

permissions:
  contents: read

jobs:
  generated-clients-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Regenerate clients
        run: scripts/gen-clients.sh

      - name: Fail on drift
        run: git diff --exit-code -- apps/web/src/api apps/ios/PetkitKit/Sources/PetkitAPI/openapi.yaml

  swift-client-builds:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: swift build
        run: swift build --package-path apps/ios/PetkitKit
