name: semgrep

# Project rules live in .semgrep/rules.yml; each one has a fixture in
# .semgrep/rules.{py,tsx} that must be caught (`semgrep --test`), so a rule that
# silently stops matching fails CI instead of passing everything.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install "semgrep==1.*"

      - name: Rule tests
        # Run from inside the directory: semgrep's test discovery skips a
        # hidden directory given as the target.
        working-directory: .semgrep
        run: semgrep --test . --metrics=off

      - name: Project rules (blocking)
        run: semgrep scan --config .semgrep/rules.yml --error --metrics=off --exclude .semgrep

      - name: Standard ruleset (blocking on ERROR)
        run: semgrep scan --config p/python --config p/typescript --config p/secrets --severity ERROR --error --metrics=off --exclude .semgrep
