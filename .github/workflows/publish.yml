name: publish

# Builds the one multi-architecture image (Dockerfile at the repository root)
# that the add-on, the local compose file and the VPS all run.
#
# Home Assistant's Supervisor pulls `image:` from addon/config.yaml at the
# add-on's own version, so a tag named after a version is a PROMISE that that
# version is released. Pushes to main therefore publish only `dev`; the version
# and `latest` are cut by a `v*` git tag whose version matches config.yaml, and
# nothing else. A pull request that touches the image builds all three
# architectures and scans them, and pushes nothing.
#
# The three architectures build in parallel, are pushed into the same package
# BY DIGEST (no tag, so the jobs cannot race for one), and a manifest list is
# assembled from them afterwards, then signed with cosign keyless (GitHub OIDC).
# Each per-arch image carries an SBOM and a provenance attestation.
#
# A release waits for the test workflows, called here as reusable workflows
# because `needs:` cannot reach a job in another file.
#
# Third-party actions are pinned to a commit SHA, not a tag: a moving tag can
# be pointed at new code, and these jobs hold `packages: write` and an OIDC
# token. To update one, resolve the tag yourself:
#
#   gh api repos/docker/build-push-action/commits/v7.4.0 --jq .sha

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - services/api/requirements.lock
      - apps/web/package.json
      - apps/web/pnpm-lock.yaml
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates. A pull request already runs each of these from its own file.
  api-tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/api-tests.yml
  web:
    if: github.event_name == 'push'
    uses: ./.github/workflows/web.yml
  contracts:
    if: github.event_name == 'push'
    uses: ./.github/workflows/contracts.yml
  ios:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ios.yml

  build:
    needs: [api-tests, web, contracts, ios]
    # Skipped gates (a pull request) let the build run; a failed one stops it.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Emulation for the two ARM targets, and buildx because TARGETARCH is a
      # BuildKit built-in the per-arch base selection depends on.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Names
        id: names
        run: |
          # A registry path must be lowercase; a GitHub owner need not be.
          echo "ref=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$PLATFORM" | tr '/' '-')" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      # A pull request builds into the local Docker and scans that. A push
      # pushes first, untagged, then pulls back exactly that digest and scans
      # it: building twice and scanning one copy would let an unpinned package
      # (ffmpeg) or a cache miss put something unscanned into the registry. A
      # digest that fails the scan is never named by the merge job, and
      # prune-packages deletes it.
      - name: Build for the scan
        if: github.event_name != 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: my-petkit-scan:${{ steps.names.outputs.slug }}
          cache-from: type=gha,scope=${{ steps.names.outputs.slug }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest, with SBOM and provenance
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ steps.names.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.names.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.slug }}

      - name: Pull the pushed digest for the scan
        if: github.event_name == 'push'
        env:
          REF: ${{ steps.names.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          SLUG: ${{ steps.names.outputs.slug }}
        run: |
          set -eu
          docker pull --platform "$PLATFORM" "${REF}@${DIGEST}"
          docker tag "${REF}@${DIGEST}" "my-petkit-scan:${SLUG}"

      - name: Scan (a critical finding with a fix blocks the release)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: my-petkit-scan:${{ steps.names.outputs.slug }}
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: table

      # An empty file named after the digest: the merge job only needs the
      # names, and this is the shape `download-artifact` reassembles cleanly.
      - name: Hand the digest to the merge job
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: digest-${{ steps.names.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this job's OIDC token for a short-lived
      # certificate naming this workflow. No key exists to leak.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, to tell whether this release is the newest one.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Assemble the manifest, name it and sign it
        run: |
          set -eu
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Refuse a tag that disagrees with config.yaml rather than
            # publishing an image the Supervisor will never ask for: it pulls
            # by the version in that file and nothing else.
            declared=$(sed -n 's/^version: *"\(.*\)"$/\1/p' addon/config.yaml)
            version="${GITHUB_REF_NAME#v}"
            if [ "$declared" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $declared"
              exit 1
            fi
            primary="$version"
            tags="-t ${image}:${version}"
            # `latest` is the newest stable release: not a prerelease
            # (2.2.0-rc1), and not a backport tagged after a newer one.
            newest=$(git tag -l 'v*' | grep -v -- '-' | sed 's/^v//' | sort -V | tail -n1)
            if [ "$version" = "${version%%-*}" ] && [ "$version" = "$newest" ]; then
              tags="$tags -t ${image}:latest"
            else
              echo "not moving latest: $version is not the newest stable release ($newest)"
            fi
          else
            # Just the one moving tag. `org.opencontainers.image.revision` on
            # the image maps a build back to its commit.
            primary="dev"
            tags="-t ${image}:dev"
          fi

          sources=""
          for d in /tmp/digests/*; do
            sources="$sources ${image}@sha256:$(basename "$d")"
          done

          # shellcheck disable=SC2086
          docker buildx imagetools create $tags $sources
          digest=$(docker buildx imagetools inspect "${image}:${primary}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "manifest list: ${image}@${digest}"

          # Sign the digest, never a tag: a tag can move after signing.
          # --recursive also signs each per-arch image, which is what a pull on
          # one machine actually fetches.
          cosign sign --yes --recursive "${image}@${digest}"

          cosign verify "${image}@${digest}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/publish\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "signature verifies"
