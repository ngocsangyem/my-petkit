name: secret-scan

# Scans the WHOLE history, not just the diff: a secret removed in a later
# commit is still published. Runs the gitleaks binary directly (checksum
# verified) instead of gitleaks-action, which needs a licence key for org repos.
#
# Third-party actions are pinned to a commit SHA. To update one, resolve the
# tag yourself: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact -v .
