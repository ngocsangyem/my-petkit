name: api-tests

# Reusable: other workflows (publish) call this one with `uses:` instead of
# `needs:`, which cannot reach a job in another file.
#
# Third-party actions are pinned to a commit SHA. To update one, resolve the
# tag yourself: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: services/api

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The golden check checks the baseline commit out into a worktree.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install (hash-locked)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: pytest
        run: python -m pytest -q

      - name: golden device responses (vs the approved baseline)
        # Every byte handed to a device or to Home Assistant must match the
        # last approved baseline: the commit in scripts/golden-baseline.sha.
        # It is pinned in a tracked file rather than a tag because a tag can
        # be deleted from the remote, which failed every run. An approved
        # behaviour change updates the file in the same PR, with the reason in
        # the commit; the commit it names must end up on main, so merge such a
        # PR with a merge commit, not a squash.
        run: python ../../scripts/golden_device_responses.py --against "$(cat ../../scripts/golden-baseline.sha)" --tz UTC --tz Asia/Saigon

      - name: golden output does not depend on the host zone
        run: |
          python ../../scripts/golden_device_responses.py --against-self --tz UTC --tz Pacific/Kiritimati
          python ../../scripts/golden_device_responses.py --against-self --zone Asia/Saigon --tz UTC --tz Pacific/Kiritimati

      - name: import boundaries (import-linter)
        run: lint-imports

      - name: ruff (baseline gate)
        run: python ../../scripts/lint-baseline-gate.py ruff ruff ruff-baseline.txt src tests

      - name: mypy (baseline gate)
        run: python ../../scripts/lint-baseline-gate.py mypy mypy mypy-baseline.txt src/my_petkit

      - name: ruff format (new user-plane code only; ported code is never reformatted)
        # Same path list as the negated per-file-ignores entry in pyproject.toml.
        run: >-
          ruff format --check src/my_petkit/features/auth src/my_petkit/shared/errors.py
          src/my_petkit/shared/redact_client.py src/my_petkit/shared/request_auth.py
          src/my_petkit/shared/tiers.py src/my_petkit/utils/user_tls.py

      - name: pip-audit (runtime lock)
        # pip-audit exits non-zero on any known vulnerability in the shipped
        # dependency set.
        run: pip-audit -r requirements.lock --require-hashes --disable-pip
