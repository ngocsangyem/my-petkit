name: web

# The web app (apps/web): lint (ESLint with the security and feature-boundary
# rules, TypeScript strict, prettier, no hex outside tokens.css), unit tests,
# the production build, and the dependency audit that blocks a high finding.
#
# Third-party actions are pinned to a commit SHA. To update one, resolve the
# tag yourself: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  push:
    paths:
      - apps/web/**
      - packages/contracts/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - apps/web/**
      - packages/contracts/**
      - .github/workflows/web.yml
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install (lockfile only)
        run: pnpm install --frozen-lockfile

      - name: Audit (high and above blocks)
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
