<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traffic capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#131416;text-decoration:none}a:hover{color:#0f6e66}
button{font-family:inherit}
.row:active{background:#f5f7f7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #0f6e66;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #ffffff; color: #131416; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">
  <header style="background: #f2f6f5; padding: 54px 16px 16px; display: flex; flex-direction: column; gap: 4px">
    <a href="ios-settings.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#131416" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600">Capture</h1>
      <span style="flex-shrink: 0; height: 20px; padding: 0 8px; border-radius: 999px; background: #ffedea; color: #831c1e; font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap">Step-up required</span>
    </div>
    <p style="margin: 0; font-size: 14px; color: #5d6262">Recording is off. 4 files on the server.</p>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 34px">
    <div style="display: flex; gap: 10px; padding: 12px; background: #f5f7f7; border-radius: 8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c4242a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M12 3 2 21h20L12 3z"></path><path d="M12 10v5M12 18h.01"></path></svg>
      <p style="margin: 0; font-size: 13px; line-height: 1.5">Captures are exact copies of traffic. They hold your Wi-Fi name, device secrets and, in proxy mode, cloud credentials. Read one before you share it.</p>
    </div>

    <label style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px"><span style="display: flex; flex-direction: column"><span style="font-weight: 500">Record traffic</span><span style="font-size: 12px; color: #5d6262">Off. Turning on asks for your password.</span></span><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #131416"></label>

    <section aria-labelledby="files-h" style="display: flex; flex-direction: column">
      <h2 id="files-h" style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Files</h2>
      <sc-for list="{{files}}" as="f" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; border-top: 1px solid #eef1f1">
          <div style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 500">{{f.name}}</span><span style="font-size: 12px; color: #5d6262; font-variant-numeric: tabular-nums">{{f.meta}}</span></div>
          <button type="button" aria-label="Download {{f.name}}" style="width: 44px; height: 44px; margin-right: -10px; flex-shrink: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#131416" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="tail-h" style="display: flex; flex-direction: column; gap: 6px">
      <h2 id="tail-h" style="margin: 0; font-size: 16px; font-weight: 600">Last lines of requests.jsonl</h2>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; background: #f5f7f7; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.5">
        <sc-for list="{{tail}}" as="t" hint-placeholder-count="3">
          <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t}}</div>
        </sc-for>
      </div>
    </section>

    <div style="flex-grow: 1"></div>
    <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: #c4242a; font: 500 15px 'IBM Plex Sans', sans-serif">Delete all captures</button>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      files: [
        { name: 'requests.jsonl', meta: '2.4 MB · HTTP from devices' },
        { name: 'mqtt.jsonl', meta: '6.1 MB · broker frames' },
        { name: 'state_report.jsonl', meta: '880 KB · state dumps' },
        { name: 'upstream.jsonl', meta: '0 KB · proxy off' }
      ],
      tail: [
        '{"t":"14:46:14","dev":"100198342","m":"POST","p":"/heartbeat","s":200}',
        '{"t":"14:45:33","dev":"100198342","m":"POST","p":"/heartbeat","s":200}',
        '{"t":"14:31:07","dev":"100234567","m":"CONNECT","p":"mqtt","s":0}'
      ]
    };
  }
}
</script>
</body>
</html>
