<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Devices · iOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#131416;text-decoration:none}a:hover{color:#0f6e66}
.row:active{background:#f5f7f7}
button:focus-visible,a:focus-visible{outline:2px solid #0f6e66;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #ffffff; color: #131416; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">

  <header style="background: #f2f6f5; padding: 54px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #5d6262">
        <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="#0f6e66" stroke-width="2"></circle><path d="M3.2 13.2 A8 8 0 0 0 16.8 13.2 Z" fill="#0f6e66"></path></svg>
        Home server · TLS pinned
      </span>
      <a href="ios-provision.dc.html" aria-label="Add a device" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#131416" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    </div>
    <h1 style="margin: 0; font-size: 24px; font-weight: 600">Devices</h1>
    <p style="margin: 0; font-size: 14px"><span style="color: #c4242a; font-weight: 500">Fountain silent since 06:10.</span> N60 deodorizer runs out in 3 days.</p>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding: 16px">
    <section aria-labelledby="day-h" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 id="day-h" style="margin: 0; font-size: 16px; font-weight: 600">Today at home</h2>
        <a href="ios-timeline.dc.html" style="font-size: 14px; color: #0f6e66">Timeline</a>
      </div>
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr); row-gap: 6px; column-gap: 8px; align-items: center; font-size: 13px">
        <span></span>
        <div style="position: relative; height: 16px; font-size: 11px; color: #5d6262; font-variant-numeric: tabular-nums">
          <span style="position: absolute; left: 0">00</span><span style="position: absolute; left: 50%; transform: translateX(-50%)">12</span><span style="position: absolute; right: 0">24</span>
          <span style="position: absolute; left: 61.6%; transform: translateX(-50%); padding: 0 3px; background: #ffffff; color: #0f6e66; font-weight: 600">14:47</span>
        </div>
        <span style="display: flex; align-items: center; gap: 6px; font-weight: 500"><img src="/_blob/38e9ae33b4e603f8aa6a989a45ef55a8" alt="" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover">Miso</span>
        <div style="position: relative; height: 28px; background: #f5f7f7; border-radius: 4px">
          <sc-for list="{{miso}}" as="v" hint-placeholder-count="3"><span style="position: absolute; top: 7px; left: {{v.left}}; width: 3px; height: 14px; background: #24548f"></span></sc-for>
          <span style="position: absolute; top: 0; bottom: 0; left: 61.6%; width: 1px; background: #0f6e66"></span>
        </div>
        <span style="display: flex; align-items: center; gap: 6px; font-weight: 500"><img src="/_blob/04acdb0fd9daefc6a525576e97df95d6" alt="" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover; object-position: 50% 20%">Mochi</span>
        <div style="position: relative; height: 28px; background: #f5f7f7; border-radius: 4px">
          <sc-for list="{{mochi}}" as="v" hint-placeholder-count="2"><span style="position: absolute; top: 7px; left: {{v.left}}; width: 3px; height: 14px; background: #7a4f08"></span></sc-for>
          <span style="position: absolute; top: 0; bottom: 0; left: 61.6%; width: 1px; background: #0f6e66"></span>
        </div>
        <span style="color: #5d6262">Meals</span>
        <div style="position: relative; height: 28px; background: #f5f7f7; border-radius: 4px">
          <sc-for list="{{meals}}" as="m" hint-placeholder-count="4"><span style="position: absolute; top: 10px; left: {{m.left}}; width: 8px; height: 8px; box-sizing: border-box; background: {{m.fill}}; border: 1.5px solid #131416"></span></sc-for>
          <span style="position: absolute; top: 0; bottom: 0; left: 61.6%; width: 1px; background: #0f6e66"></span>
        </div>
      </div>
    </section>

    <section aria-labelledby="dev-h" style="display: flex; flex-direction: column; gap: 6px">
      <h2 id="dev-h" style="margin: 0; font-size: 16px; font-weight: 600">4 devices</h2>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{devices}}" as="d" hint-placeholder-count="4">
          <a href="{{d.href}}" class="row" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid #eef1f1; align-items: baseline">
            <span style="font-weight: 500">{{d.name}}</span>
            <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: {{d.ink}}"><span style="width: 7px; height: 7px; border-radius: 50%; box-sizing: border-box; background: {{d.dot}}; border: 1.5px solid {{d.ink}}"></span>{{d.status}}</span>
            <span style="font-size: 13px; color: #5d6262">{{d.line}}</span>
            <span style="font-size: 13px; color: {{d.attnInk}}; text-align: right; font-variant-numeric: tabular-nums">{{d.attn}}</span>
          </a>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 83px; box-sizing: border-box; padding: 8px 4px 0; background: #f2f6f5; font-size: 11px; font-weight: 500">
    <a href="ios-devices.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #131416"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M5 15h14"></path></svg>Devices</a>
    <a href="ios-timeline.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h16M8 8v8M14 6v12"></path></svg>Timeline</a>
    <a href="ios-pets.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="6"></circle><path d="M7 8 6 3l4 3M17 8l1-5-4 3"></path></svg>Pets</a>
    <a href="ios-logs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"></path></svg>Logs</a>
    <a href="ios-settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Strip positions: minutes since midnight / 1440.
    const at = (h, m) => ((h * 60 + m) / 1440 * 100).toFixed(1) + '%';
    return {
      miso: [{ left: at(1, 12) }, { left: at(8, 31) }, { left: at(13, 58) }],
      mochi: [{ left: at(3, 47) }, { left: at(11, 5) }],
      meals: [
        { left: at(7, 0), fill: '#131416' },
        { left: at(12, 0), fill: '#131416' },
        { left: at(18, 0), fill: '#ffffff' },
        { left: at(22, 0), fill: '#ffffff' }
      ],
      devices: [
        { href: 'ios-device-t6.dc.html', name: 'Litter box', status: 'Online · MQTT', ink: '#1e7b4f', dot: '#1e7b4f', line: 'Idle · cleaned 14:05 · 14 bags', attn: 'N60 in 3 days', attnInk: '#92400e' },
        { href: 'ios-schedules.dc.html', name: 'Kitchen feeder', status: 'Polling', ink: '#2f70bb', dot: '#2f70bb', line: 'Next meal 18:00 · 20 g', attn: '35 of 65 g fed', attnInk: '#5d6262' },
        { href: 'ios-devices.dc.html', name: 'Water fountain', status: 'Offline', ink: '#c4242a', dot: '#c4242a', line: 'Last: water 40 % · filter 9 d', attn: 'Since 06:10', attnInk: '#c4242a' },
        { href: 'ios-device-t6.dc.html', name: 'Pura Air spray', status: 'Unknown', ink: '#5d6262', dot: 'transparent', line: 'K3 · relayed by the litter box', attn: '2 d ago', attnInk: '#5d6262' }
      ]
    };
  }
}
</script>
</body>
</html>
