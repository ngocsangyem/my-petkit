<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline · iOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#131416;text-decoration:none}a:hover{color:#0f6e66}
button:focus-visible,a:focus-visible{outline:2px solid #0f6e66;outline-offset:2px}
.chips{scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #ffffff; color: #131416; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">

  <header style="background: #f2f6f5; padding: 54px 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #5d6262"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="#0f6e66" stroke-width="2"></circle><path d="M3.2 13.2 A8 8 0 0 0 16.8 13.2 Z" fill="#0f6e66"></path></svg>my-petkit</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 600">Timeline</h1>
    <p style="margin: 0; font-size: 14px; color: #5d6262">Tue 28 Oct · Asia/Saigon · <span style="font-variant-numeric: tabular-nums">5 visits</span>: Miso 3, Mochi 2</p>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 0">
    <section aria-label="Today at home" style="display: grid; grid-template-columns: 56px minmax(0, 1fr); row-gap: 4px; column-gap: 8px; align-items: center; font-size: 13px">
      <span></span>
      <div style="position: relative; height: 14px; font-size: 11px; color: #5d6262; font-variant-numeric: tabular-nums">
        <span style="position: absolute; left: 0">00</span><span style="position: absolute; left: 50%; transform: translateX(-50%)">12</span><span style="position: absolute; right: 0">24</span>
        <span style="position: absolute; left: 61.6%; transform: translateX(-50%); padding: 0 3px; background: #ffffff; color: #0f6e66; font-weight: 600">14:47</span>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 500"><img src="/_blob/38e9ae33b4e603f8aa6a989a45ef55a8" alt="" style="width: 18px; height: 18px; border-radius: 50%; object-fit: cover">Miso</span>
      <div style="position: relative; height: 22px; background: #f5f7f7; border-radius: 4px">
        <sc-for list="{{miso}}" as="v" hint-placeholder-count="3"><span style="position: absolute; top: 4px; left: {{v.left}}; width: 3px; height: 14px; background: #24548f"></span></sc-for>
        <span style="position: absolute; top: 0; bottom: 0; left: 61.6%; width: 1px; background: #0f6e66"></span>
      </div>
      <span style="display: flex; align-items: center; gap: 6px; font-weight: 500"><img src="/_blob/04acdb0fd9daefc6a525576e97df95d6" alt="" style="width: 18px; height: 18px; border-radius: 50%; object-fit: cover; object-position: 50% 20%">Mochi</span>
      <div style="position: relative; height: 22px; background: #f5f7f7; border-radius: 4px">
        <sc-for list="{{mochi}}" as="v" hint-placeholder-count="2"><span style="position: absolute; top: 4px; left: {{v.left}}; width: 3px; height: 14px; background: #7a4f08"></span></sc-for>
        <span style="position: absolute; top: 0; bottom: 0; left: 61.6%; width: 1px; background: #0f6e66"></span>
      </div>
    </section>

    <div class="chips" role="group" aria-label="Filter events" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px; flex-shrink: 0">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{c.pressed}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 999px; background: #ffffff; border: 1px solid {{c.line}}; color: {{c.ink}}; font: 500 14px 'IBM Plex Sans', sans-serif">{{c.label}}</button>
      </sc-for>
    </div>

    <section aria-labelledby="ev-h" style="display: flex; flex-direction: column">
      <h2 id="ev-h" style="margin: 0 0 4px; font-size: 16px; font-weight: 600">Today</h2>
      <sc-for list="{{events}}" as="e" hint-placeholder-count="5">
        <article style="display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 12px; padding: 9px 0; border-top: 1px solid #eef1f1">
          <img src="{{e.photo}}" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; margin-top: 16px; background: #e8eded">
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 13px; color: #5d6262; font-variant-numeric: tabular-nums">{{e.time}}</span>
            <span style="font-weight: 500">{{e.title}}</span>
            <span style="font-size: 13px; color: #5d6262; font-variant-numeric: tabular-nums">{{e.meta}}</span>
            <sc-if value="{{e.hasVideo}}" hint-placeholder-val="{{false}}">
              <span style="display: flex; align-items: center; gap: 14px; font-size: 13px">
                <button type="button" aria-label="Play visit video" style="min-height: 44px; margin: -8px 0; padding: 0; border: 0; background: none; color: #0f6e66; font: 500 13px 'IBM Plex Sans', sans-serif; display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#0f6e66" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Play video</button>
                <a href="ios-timeline.dc.html" style="color: #0f6e66">2 waste photos · 1 health check</a>
              </span>
            </sc-if>
            <sc-if value="{{e.note}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 13px; color: {{e.noteInk}}">{{e.note}}</span>
            </sc-if>
          </div>
        </article>
      </sc-for>
    </section>
  </main>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: 83px; flex: none; box-sizing: border-box; padding: 8px 4px 0; background: #f2f6f5; font-size: 11px; font-weight: 500">
    <a href="ios-devices.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M5 15h14"></path></svg>Devices</a>
    <a href="ios-timeline.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #131416"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h16M8 8v8M14 6v12"></path></svg>Timeline</a>
    <a href="ios-pets.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="6"></circle><path d="M7 8 6 3l4 3M17 8l1-5-4 3"></path></svg>Pets</a>
    <a href="ios-logs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"></path></svg>Logs</a>
    <a href="ios-settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #5d6262"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Strip positions: minutes since midnight / 1440.
    const at = (h, m) => ((h * 60 + m) / 1440 * 100).toFixed(1) + '%';
    const MISO = '/_blob/38e9ae33b4e603f8aa6a989a45ef55a8';
    const MOCHI = '/_blob/04acdb0fd9daefc6a525576e97df95d6';
    const labels = ['All', 'Miso', 'Mochi', 'Unrecognised', 'Litter box', 'Feeder', 'Fountain'];
    return {
      miso: [{ left: at(1, 12) }, { left: at(8, 31) }, { left: at(13, 58) }],
      mochi: [{ left: at(3, 47) }, { left: at(11, 5) }],
      chips: labels.map((label, i) => ({
        label,
        pressed: i === 0 ? 'true' : 'false',
        line: i === 0 ? '#0f6e66' : '#cdd3d2',
        ink: i === 0 ? '#0f6e66' : '#131416'
      })),
      events: [
        { photo: MISO, who: 'Miso', time: '13:58', title: 'Miso used the litter box', meta: '1 min 55 s · 5.43 kg · cleaned 14:05', hasVideo: false, note: 'Video assembling…', noteInk: '#5d6262' },
        { photo: MOCHI, who: 'Mochi', time: '11:05', title: 'Mochi used the litter box', meta: '1 min 50 s · 3.86 kg · cleaned 11:12', hasVideo: false, note: '', noteInk: '' },
        { photo: MISO, who: 'Miso', time: '08:31', title: 'Miso used the litter box', meta: '2 min 40 s · 5.42 kg · cleaned 08:39', hasVideo: true, note: '', noteInk: '' },
        { photo: MOCHI, who: 'Mochi', time: '03:47', title: 'Mochi used the litter box', meta: '1 min 32 s · 3.87 kg · cleaned 03:54', hasVideo: false, note: 'Video saved as .ts, which iPhone cannot play. Open on the web dashboard.', noteInk: '#5d6262' },
        { photo: MISO, who: 'Miso', time: '01:12', title: 'Miso used the litter box', meta: '2 min 10 s · 5.41 kg · cleaned 01:19', hasVideo: false, note: '', noteInk: '' }
      ]
    };
  }
}
</script>
</body>
</html>
