    SetupLiveSettings:
      type: object
      description: Every live setting, all keys always present.
      required:
      - proxy_mode
      - proxy_upstream
      - proxy_dns
      - proxy_block_run_cmd
      - proxy_block_ota
      - proxy_block_log_upload
      - proxy_media_real_oss
      - proxy_local_cvr_window
      - proxy_mqtt_bridge
      - proxy_only
      - capture
      properties:
        proxy_mode:
          type: boolean
          description: Forward device traffic to the real cloud. Default false. R3.
        proxy_upstream:
          type: string
          description: Upstream preset key or an allow-listed PetKit/Aliyun IoT URL; empty means default
            preset. Default "". R3.
        proxy_dns:
          type: string
          description: IPv4 resolver, optional ":port"; hostnames refused. Default "". R3.
        proxy_block_run_cmd:
          type: boolean
          description: Block cloud shell commands. Default true. R3.
        proxy_block_ota:
          type: boolean
          description: Block cloud firmware pushes. Default true. R3.
        proxy_block_log_upload:
          type: boolean
          description: Default true. R3.
        proxy_media_real_oss:
          type: boolean
          description: Default false. R3.
        proxy_local_cvr_window:
          type: boolean
          description: Default false. R3.
        proxy_mqtt_bridge:
          type: boolean
          description: Default true. R3.
        proxy_only:
          type: string
          description: Default "". R3.
        capture:
          type: boolean
          description: Record traffic (including secrets) to disk. Default false. R3.
    SetupLiveSettingsPatch:
      type: object
      description: Any subset of the live settings. Bool keys are coerced with bool(), string keys with
        str(). Unknown keys ignored. A body with no known key yields 400.
      additionalProperties: true
      properties:
        proxy_mode:
          type: boolean
        proxy_upstream:
          type: string
          description: Empty, a preset key (petkit-eu, petkit-americas, petkit-asia, petkit-cn, petkit-ru)
            or an allow-listed URL.
        proxy_dns:
          type: string
          description: Empty or IPv4[:port].
        proxy_block_run_cmd:
          type: boolean
        proxy_block_ota:
          type: boolean
        proxy_block_log_upload:
          type: boolean
        proxy_media_real_oss:
          type: boolean
        proxy_local_cvr_window:
          type: boolean
        proxy_mqtt_bridge:
          type: boolean
        proxy_only:
          type: string
        capture:
          type: boolean
