      - media
      summary: Serve one file from the media tree (stills, video, HLS playlists)
      description: 'Path is relative to the media root. Files are served by aiohttp FileResponse (Content-Type
        guessed from the extension; Range gives 206, bad range 416, conditional gives 304). A .m3u8 playlist
        is instead read and returned as application/vnd.apple.mpegurl with every segment URI re-signed
        (no Range support on that branch). Missing, hidden (dot-prefixed component) and path-escape attempts
        are all 404.


        `{path}` spans several segments (it may contain `/`), which OpenAPI path parameters cannot express:
        a generated client would percent-encode the slashes. Build the URL by appending the relative path
        to the base instead.'
      x-risk-tier: signed-media
      parameters:
      - name: path
        in: path
        required: true
        description: Path relative to the media root (may contain slashes).
        schema:
          type: string
      - name: Range
        in: header
        required: false
        schema:
          type: string
          examples:
          - bytes=0-1023
      - name: exp
        in: query
        required: false
        description: Signed-link expiry (epoch seconds); with sig, replaces a session/token.
        schema:
          type: string
      - name: sig
        in: query
        required: false
        description: Signed-link signature.
        schema:
          type: string
      responses:
        '200':
          description: File bytes, or a re-signed HLS playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a Range request.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (conditional request).
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '416':
          description: Unsatisfiable Range; empty body, answered by the file server.
          headers:
            Content-Range:
              schema:
                type: string
              description: '`bytes */<size>`'
      security:
      - bearerAuth: []
      - cookieAuth: []
      - signedUrl: []
