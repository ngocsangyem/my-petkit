# The user-plane HTTP contract. Maintained by hand; the code is the source of truth.
# Checked by services/api/tests/test_contract_spec_paths_exist.py.
openapi: 3.1.0
info:
  title: my-petkit user-plane API
  version: 1.0.0
  description: 'The HTTP API the web app and the iOS app use. The server code is the source of
    truth; this document follows it, and `services/api/tests/test_contract_spec_paths_exist.py` checks
    that every operation here exists with the risk tier it claims.


    Compatibility rule: adding a response key is safe; renaming or removing one is not.


    Every operation carries `x-risk-tier`: `credential` (no principal, rate-limited), `signed-media` (a
    principal or a valid `exp`+`sig` link), `R0`/`R0*` (reads, plus session housekeeping such as logout
    and step-up; `*` = sensitive), `R1` (settings and data writes), `R2` (device commands), `R3` (needs
    a step-up within the last 5 minutes). A handler may raise one request to R3 (for example a settings
    write that touches a `proxy_*` key), answered by 403 `step_up_required`.


    Every unsafe method (and the WebSocket upgrade) must be sent to an allowed `Host`, whatever the credential,
    and a browser credential must also carry an `Origin` matching it; either refusal is a 403 (`host_not_allowed`,
    `origin_not_allowed`, `origin_required`). Any request body is capped at 16 MiB (413). Home Assistant
    Ingress is a third way in, trusted only from the Supervisor''s address on the Ingress port; it is
    not a client-usable scheme and is not listed.


    Not described here: the WebSocket streams `/api/ws` (see `ws-events.md`) and `/api/devices/{id}/talk`,
    and the web app''s document and build files, served at `/`.'
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
- url: ./
  description: Relative, so the spec works behind the Ingress prefix.
security:
- bearerAuth: []
- cookieAuth: []
tags:
- name: setup
  description: Server info, settings, retention and the block list.
- name: devices
  description: 'Registered devices: detail, commands and per-device settings.'
- name: schedules
  description: Feeding schedules and deferred feeds.
- name: sounds
  description: Custom sounds on camera feeders.
- name: ble
  description: BLE accessories paired through a device.
- name: patchers
  description: On-device firmware patches.
- name: logs
  description: Live event log, traffic captures and device-uploaded logs.
- name: timeline
  description: Recorded events.
- name: media
  description: Recorded media files and thumbnails.
- name: live
  description: Live camera video through the bundled go2rtc (HLS, MSE, WebRTC signaling).
- name: pets
  description: Pets and their face photos.
- name: auth
  description: Admin setup, sessions, step-up, pairing and client tokens.
paths:
  /api/info:
    get:
      operationId: getServerInfo
      tags:
      - setup
      summary: Server-wide facts for the Setup tab
      x-risk-tier: R0*
      responses:
        '200':
          description: Server facts, TLS pin, live settings and proxy counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupServerInfo'
        '401':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/settings:
    get:
      operationId: getLiveSettings
      tags:
      - setup
      summary: Live-editable runtime settings
      x-risk-tier: R0
      responses:
        '200':
          description: Current values of every live setting (all keys always present).
          content:
            application/json:
              schema:
                type: object
                required:
                - settings
                - writable
                properties:
                  settings:
                    $ref: '#/components/schemas/SetupLiveSettings'
                  writable:
                    type: boolean
                    description: False when no shared live config is wired (writes then answer 400).
        '401':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: updateLiveSettings
      tags:
      - setup
      summary: Update live runtime settings
      description: 'Keys outside the known set are ignored. The whole batch is validated before any of
        it is applied. Writing any proxy_* key or capture needs a step-up (R3), other keys are R1; the
        tier follows the keys named in the body.

        '
      x-risk-tier: R1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupLiveSettingsPatch'
      responses:
        '200':
          description: Settings applied and persisted to the overrides file (persist failure is only logged).
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - changed
                - settings
                properties:
                  ok:
                    type: boolean
                  changed:
                    $ref: '#/components/schemas/SetupLiveSettingsPatch'
                  settings:
                    $ref: '#/components/schemas/SetupLiveSettings'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/blocked:
    get:
      operationId: listBlockedAttempts
      tags:
      - setup
      summary: What the real cloud tried to do to a device and was refused
      x-risk-tier: R0*
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 200
        description: Clamped to 1..1000; junk falls back to the default.
      - name: device
        in: query
        required: false
        schema:
          type: integer
        description: Filter by device id (non-numeric value is ignored).
      - name: kind
        in: query
        required: false
        schema:
          type: string
        description: Filter by blocking rule name (e.g. rce, ota, secret).
      - name: reveal
        in: query
        required: false
        schema:
          type: string
          enum:
          - '1'
        description: With "1", payload_json is returned unmasked and the request needs a step-up.
      responses:
        '200':
          description: Newest-first blocked attempts plus per-rule redaction counters since start.
          content:
            application/json:
              schema:
                type: object
                required:
                - records
                - counts
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/SetupBlockedAttempt'
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                    description: Per-rule redaction totals since process start.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/retention:
    get:
      operationId: getRetention
      tags:
      - setup
      summary: Per-category media and event retention caps
      x-risk-tier: R0
      responses:
        '200':
          description: Current caps.
          content:
            application/json:
              schema:
                type: object
                required:
                - retention
                properties:
                  retention:
                    $ref: '#/components/schemas/SetupRetention'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: updateRetention
      tags:
      - setup
      summary: Merge a partial retention patch and persist it
      description: 'Unknown categories and fields are ignored. A max_mb/max_days value that is not a positive
        finite number becomes null (no cap).

        '
      x-risk-tier: R1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRetentionPatch'
      responses:
        '200':
          description: Patch applied and saved.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - retention
                properties:
                  ok:
                    type: boolean
                  retention:
                    $ref: '#/components/schemas/SetupRetention'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/ble:
    get:
      operationId: listBleAccessories
      tags:
      - ble
      summary: List paired BLE accessories
      x-risk-tier: R0*
      responses:
        '200':
          description: All accessories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BleAccessoryList'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: pairBleAccessory
      tags:
      - ble
      summary: Pair or update a BLE accessory by hand
      description: Registers (or updates, when petkit_id/mac match) an accessory and announces it to Home
        Assistant and its parent device.
      x-risk-tier: R1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BleAccessoryPairRequest'
      responses:
        '200':
          description: Full accessory list after the write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BleAccessoryList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/ble/import:
    post:
      operationId: importBleAccessories
      tags:
      - ble
      summary: Import the accessories PetKit's cloud lists for a device
      description: Queries dev_ble_device, dev_device_info and (litter boxes only) dev_k3_device_info
        upstream as the device and pairs what it finds.
      x-risk-tier: R1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - device_id
              properties:
                device_id:
                  type: integer
                  description: Registered parent device whose account is asked.
      responses:
        '200':
          description: Import outcome per accessory plus the full list.
          content:
            application/json:
              schema:
                type: object
                required:
                - imported
                - results
                - accessories
                properties:
                  imported:
                    type: integer
                    description: Count of accessories newly paired or changed.
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BleImportResult'
                  accessories:
                    type: array
                    items:
                      $ref: '#/components/schemas/BleAccessory'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/ble/{id}:
    delete:
      operationId: deleteBleAccessory
      tags:
      - ble
      summary: Unpair a BLE accessory
      x-risk-tier: R1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Removed; remaining accessories returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - accessories
                - note
                properties:
                  ok:
                    type: boolean
                  accessories:
                    type: array
                    items:
                      $ref: '#/components/schemas/BleAccessory'
                  note:
                    type: string
                    description: Reminder that Home Assistant keeps the entities.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/ble/{id}/command:
    post:
      operationId: sendBleCommand
      tags:
      - ble
      summary: Set one entity on a BLE accessory via its parent
      description: Delivered only while the parent is on MQTT; there is no queueing.
      x-risk-tier: R2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entity
              properties:
                entity:
                  type: string
                  description: Entity key from the accessory's entities list.
                value:
                  description: 'Stringified by the server. switch: ON/OFF/1/0/TRUE/FALSE; select: one
                    of the entity''s option labels; number: decimal; ignored for button.

                    '
                  type:
                  - string
                  - number
                  - boolean
      responses:
        '200':
          description: Command published to the parent.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - delivered
                - entity
                - cmd
                - via
                properties:
                  ok:
                    type: boolean
                  delivered:
                    type: string
                    enum:
                    - ble
                  entity:
                    type: string
                  cmd:
                    type: integer
                    description: BLE command code built for the accessory.
                  via:
                    type: integer
                    description: Parent device petkit_id that relayed it.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/ble/{id}/poll:
    post:
      operationId: pollBleAccessory
      tags:
      - ble
      summary: Ask the parent to read the accessory now
      x-risk-tier: R2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Read request sent.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - via
                properties:
                  ok:
                    type: boolean
                  via:
                    type: integer
                    description: Parent device petkit_id.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/devices/{id}/patcher:
    get:
      operationId: getDevicePatcherStatus
      tags:
      - patchers
      summary: Per-patcher status for a device
      x-risk-tier: R0*
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Patcher states; supported false (empty patchers) for non-Linux devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatcherStatus'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: applyDevicePatcher
      tags:
      - patchers
      summary: Start applying or removing an on-device patcher
      description: Accepted means started; the run takes minutes and reports progress as patcher events
        over the WebSocket. Any action other than "remove" is treated as apply.
      x-risk-tier: R3
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - patcher
              properties:
                patcher:
                  type: string
                  enum:
                  - mqtt
                  - cloud
                  - cacert
                  - camera
                  - ssh
                  - talk
                  - pan
                action:
                  type: string
                  default: apply
                  description: '"remove" removes the patcher; any other value applies it.'
                pubkey:
                  type: string
                  description: SSH public key (ssh-rsa, ecdsa-sha2-*, ssh-ed25519). Required for ssh apply
                    unless one is already stored on the device; persisted on success.
      responses:
        '200':
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - patcher
                - action
                properties:
                  ok:
                    type: boolean
                  patcher:
                    type: string
                  action:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/devices:
    get:
      operationId: listDevices
      tags:
      - devices
      summary: List devices
      x-risk-tier: R0*
      responses:
        '200':
          description: Bare JSON array of device summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSummary'
        '401':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/devices/{id}:
    get:
      operationId: getDevice
      tags:
      - devices
      summary: Device detail
      x-risk-tier: R0*
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Device (petkit) id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
    delete:
      operationId: deleteDevice
      tags:
      - devices
      summary: Remove a device from the registry
      x-risk-tier: R1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Device (petkit) id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDeleteResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/devices/{id}/command:
    post:
      operationId: sendDeviceCommand
      tags:
      - devices
      summary: Send a command to a device
      x-risk-tier: R2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Device (petkit) id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCommandRequest'
      responses:
        '200':
          description: Command accepted (delivered via MQTT or heartbeat queue, or applied locally)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCommandResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/devices/{id}/schedule:
    post:
      operationId: saveDeviceSchedule
      tags:
      - schedules
      summary: Store a schedule and push it to the device
      x-risk-tier: R2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Device (petkit) id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleSaveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDeliveryResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/devices/{id}/deferred-feed:
    get:
      operationId: listDeferredFeeds
      tags:
      - schedules
      summary: List pending deferred (one-off) feeds
      x-risk-tier: R0
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Device (petkit) id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferredFeedList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
    post:
      operationId: addDeferredFeed
      tags:
      - schedules
      summary: Add a deferred (one-off) feed
      x-risk-tier: R2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Device (petkit) id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeferredFeedCreateRequest'
      responses:
        '200':
          description: Deferred feed stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeferredFeedCreateResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/devices/{id}/deferred-feed/{feed_id}:
    delete:
      operationId: deleteDeferredFeed
      tags:
      - schedules
      summary: Delete a deferred feed
      x-risk-tier: R2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Device (petkit) id
      - name: feed_id
        in: path
        required: true
        schema:
          type: string
        description: Deferred feed id such as d_20260813_61500. Unknown ids are ignored.
      responses:
        '200':
          description: OK
          content:
