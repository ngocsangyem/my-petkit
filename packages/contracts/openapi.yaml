  /api/devicelogs/{path}:
    get:
      operationId: readDeviceLog
      tags:
      - logs
      summary: Read a filtered window of one device log, or download the raw file
      description: 'With a non-empty `download` query the raw file is returned as text/plain attachment
        and the request additionally needs a fresh step-up (otherwise 403 step_up_required). Otherwise
        a JSON window of lines is returned, unmasked except for the client redactor. `path` may contain
        slashes (relative to the device log root).


        `{path}` spans several segments (it may contain `/`), which OpenAPI path parameters cannot express:
        a generated client would percent-encode the slashes. Build the URL by appending the relative path
        to the base instead.'
      x-risk-tier: R0*
      parameters:
      - name: path
        in: path
        required: true
        description: File path relative to the device log root (the `rel` value from the listing).
        schema:
          type: string
      - name: download
        in: query
        required: false
        description: Any non-empty value switches to raw download (step-up required).
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Case-insensitive substring terms (whitespace separated, ANDed). Never a regex.
        schema:
          type: string
          default: ''
      - name: limit
        in: query
        required: false
        description: Lines per window; junk ignored, clamped to 1..2000.
        schema:
          type: integer
          default: 500
          minimum: 1
          maximum: 2000
      - name: offset
        in: query
        required: false
        description: Index into the matched lines; negative or junk becomes 0.
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: Range
        in: header
        required: false
        description: Only honoured on the download branch (FileResponse); the JSON window ignores it.
        schema:
          type: string
          examples:
          - bytes=0-1023
      responses:
        '200':
          description: JSON window of lines, or the raw file when `download` is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLogRead'
            text/plain:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a Range request (download branch only).
          content:
            text/plain:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (conditional request; download branch only).
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '416':
          description: Unsatisfiable Range; empty body, answered by the file server.
          headers:
            Content-Range:
              schema:
                type: string
              description: '`bytes */<size>`'
        '500':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/timeline:
    get:
      operationId: getTimeline
      tags:
      - timeline
      summary: Grouped visit sessions for one local day, with media slots
      description: The day is cut at local midnight (server timezone). An unparseable `date` falls back
        to today and the response echoes the day used. Reads at most 2000 stored events for the day. `counts`
        is computed after the device/pet narrowing but before the `filter` chip.
      x-risk-tier: R0*
      parameters:
      - name: device
        in: query
        required: false
        description: Petkit device id; non-numeric ignored.
        schema:
          type: integer
      - name: pet
        in: query
        required: false
        description: Pet id; keeps only sessions attributed to that pet. Non-numeric ignored.
        schema:
          type: integer
      - name: filter
        in: query
        required: false
        description: Filter chip. Unknown values match nothing.
        schema:
          type: string
          default: all
          examples:
          - all
          - pet
          - toileting
          - drinking
          - feeding
          - cleaning
          - health_alert
          - fault
      - name: date
        in: query
        required: false
        description: Local day, YYYY-MM-DD.
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      responses:
        '200':
          description: The day's sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineDay'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
