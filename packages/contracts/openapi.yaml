      description: 'Only go2rtc''s own file names are served, with its `id` (session) and `n` parameters
        passed through. Media playlists come back re-signed like the master. Fetch segments one at a time:
        go2rtc hands each request whatever has buffered since the last one.'
      x-risk-tier: signed-media
      parameters:
      - name: id
        in: path
        required: true
        description: The device's petkit id.
        schema:
          type: integer
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum:
          - playlist.m3u8
          - segment.ts
          - init.mp4
          - segment.m4s
      - name: id
        in: query
        required: true
        description: go2rtc's HLS session id, as the playlist names it.
        schema:
          type: string
      - name: n
        in: query
        required: false
        schema:
          type: string
      - name: exp
        in: query
        required: false
        description: Signed-link expiry (epoch seconds); with sig, replaces a session/token.
        schema:
          type: string
      - name: sig
        in: query
        required: false
        description: Signed-link signature.
        schema:
          type: string
      responses:
        '200':
          description: A media playlist or segment bytes.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/iso.segment:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
      - signedUrl: []
  /api/live/{id}/webrtc:
    post:
      operationId: postLiveWebrtcOffer
      tags:
      - live
      summary: Exchange a WebRTC offer for go2rtc's answer
      description: 'No trickle ICE: the server answers once it has gathered every candidate, so send the offer
        after your own ICE gathering completes. Media then flows directly to the server''s WebRTC port (TCP
        and UDP), protected by DTLS/SRTP; only this signaling step is behind auth. 409 `webrtc_unavailable`
        when the server has no `webrtc_candidates`; use MSE or HLS instead.'
      x-risk-tier: R0*
      parameters:
      - name: id
        in: path
        required: true
        description: The device's petkit id.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebrtcSessionDescription'
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebrtcSessionDescription'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
  /api/auth/media-url:
    post:
      operationId: authMediaUrl
      tags:
      - auth
      summary: Sign a five-minute URL for a file under /api/media/
      x-risk-tier: R0*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMediaUrlRequest'
      responses:
        '200':
          description: Signed, percent-encoded URL.
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - expires_in
                properties:
                  url:
                    type: string
                    description: Path under /api/media/ with exp and signature query parameters.
                  expires_in:
                    type: integer
                    description: Lifetime in seconds (300).
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
      description: 'Sign a five-minute URL for a file under /api/media/


        The returned `url` is root-absolute (`/api/media/...`). Behind Home Assistant Ingress the client
        must put its Ingress prefix in front of it.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A client token from `POST /api/auth/pairing/redeem`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-mp_session
      description: The browser session set by setup or login.
    signedUrl:
      type: apiKey
      in: query
      name: sig
      description: 'A link from `POST /api/auth/media-url`: `exp` (expiry, Unix seconds) and `sig` together,
        valid for exactly the path they were issued for. For media players that cannot send a token.'
  schemas:
    LiveInfo:
      type: object
      required:
      - available
      - reason
      - modes
      - hls_url
      properties:
        available:
          type: boolean
        reason:
          description: Why nothing can be watched; null when available.
          type:
          - string
          - 'null'
          enum:
          - not_a_camera
          - device_unreachable
          - no_stream
          - sidecar_down
          - null
        modes:
          type: array
          description: Ways to watch, in preference order; empty when unavailable.
          items:
            type: string
            enum:
            - webrtc
            - mse
            - hls
        hls_url:
          description: Root-absolute signed master playlist URL (five minutes); null when unavailable.
          type:
          - string
          - 'null'
    WebrtcSessionDescription:
      type: object
      required:
      - type
      - sdp
      properties:
        type:
          type: string
          description: '`offer` in the request, `answer` in the response.'
          enum:
          - offer
          - answer
        sdp:
          type: string
    AuthMediaUrlRequest:
      type: object
      additionalProperties: false
      required:
      - path
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: File path, with or without the /api/media/ prefix.
    AuthOk:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    AuthPasswordRequest:
      type: object
      additionalProperties: false
      required:
      - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
    AuthRedeemRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 64
          default: client
          description: Label for the issued token.
    AuthSetupRequest:
      type: object
      additionalProperties: false
      required:
      - setup_token
      - password
      properties:
        setup_token:
          type: string
          minLength: 1
          maxLength: 128
          description: One-time token printed in the server log.
        password:
          type: string
          minLength: 10
          maxLength: 1024
          description: Schema accepts 1-1024 characters; setup additionally refuses under 10 with 400
            weak_password.
    AuthTokenInfo:
      type: object
      required:
      - id
      - name
      - created_at
      - last_used
      properties:
        id:
          type: integer
        name:
          type: string
        created_at:
          type: number
        last_used:
          type: number
    BleAccessory:
      type: object
      description: One accessory as the panel shows it, after client redaction (secret may be masked).
      required:
      - petkit_id
      - ble_type
      - name
      - parent_name
      - parent_type
      - parent_online
      - last_seen
      - entities
      - mac
      - secret
      - interval
      - link_with
      - serial_number
      - scan_type
      - scan_type_is_guessed
      - wire_entry
      - state
      properties:
        petkit_id:
          type: integer
        ble_type:
          type: string
          enum:
          - w5
          - w4
          - ctw3
          - ctw2
          - k3
        name:
          type: string
        parent_name:
          type: string
        parent_type:
          description: Parent device type; empty string when no parent.
          type:
          - string
          - integer
        parent_online:
          type: boolean
        last_seen:
          type:
          - number
          - 'null'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/BleAccessoryEntity'
        mac:
          type: string
        secret:
          type: string
          description: Pairing secret after client redaction. An empty secret is returned as an empty
            string; any non-empty value is always masked as the literal text [redacted N chars], where
            N is the length of the stored secret (for example [redacted 16 chars]). The real value is
            never returned.
        interval:
          type: integer
        link_with:
          type: integer
          description: Parent device id; 0 when unlinked.
        serial_number:
          type: string
        scan_type:
          type: integer
        scan_type_is_guessed:
          type: boolean
        wire_entry:
          type: object
          description: Entry handed to the parent in dev_ble_device. Its secret is masked the same way
            as the top-level secret.
          required:
          - id
          - secret
          - type
          - mac
          - interval
          properties:
            id:
              type: integer
            secret:
              type: string
            type:
              type: integer
              description: Numeric BLE type code
            mac:
              type: string
              description: MAC in the wire form the device expects
            interval:
              type: integer
        state:
          type: object
          additionalProperties: true
          description: Decoded accessory state document.
    BleAccessoryEntity:
      type: object
      required:
      - component
      - key
      - name
      - value_path
      - unit
      - device_class
      - icon
      - options
      - option_values
      - settable
      - entity_category
      - min
      - max
      - step
      - value
      properties:
        component:
          type: string
          description: HA component (sensor, switch, select, number, button, ...).
        key:
          type: string
        name:
          type: string
        value_path:
          type:
          - string
          - 'null'
        unit:
          type:
          - string
          - 'null'
        device_class:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
        options:
          type:
          - array
          - 'null'
          items: {}
        option_values:
          type:
          - array
          - 'null'
          items: {}
        settable:
          type: boolean
        entity_category:
          type:
          - string
          - 'null'
        min:
          type:
          - number
          - 'null'
        max:
          type:
          - number
          - 'null'
        step:
          type:
          - number
          - 'null'
        value:
          description: Resolved value from the accessory state; null for buttons or unreported.
    BleAccessoryList:
      type: object
      required:
      - accessories
      properties:
        accessories:
          type: array
          items:
            $ref: '#/components/schemas/BleAccessory'
    BleAccessoryPairRequest:
      type: object
      required:
      - ble_type
      - mac
      properties:
        ble_type:
          type: string
          enum:
          - w5
          - w4
          - ctw3
          - ctw2
          - k3
          description: Lower-cased and trimmed by the server.
        petkit_id:
          type: integer
          description: Omitted or 0 allocates an id from 900001 upward. Must not equal a real device id.
        mac:
          type: string
          description: 12 hex digits, any common separator; must not already be paired to another id.
        link_with:
          type: integer
          description: Parent device id; must exist when non-zero.
        secret:
          type: string
          default: ''
        interval:
          type: integer
          default: 240
        serial_number:
          type: string
          default: ''
        scan_type:
          type: integer
          minimum: 0
          default: 0
          description: Overrides the type the parent is told to scan for; negatives become 0.
    BleImportResult:
      type: object
      required:
      - outcome
      properties:
        endpoint:
          type: string
          description: Present on upstream refusal entries.
        petkit_id:
          type: integer
        ble_type:
          type:
          - string
          - 'null'
        mac:
          type:
          - string
          - 'null'
        outcome:
          type: string
          description: imported, updated, unchanged, an upstream refusal message, or a reason the entry
            was skipped.
    CaptureFile:
      type: object
      required:
      - name
      - size
      - lines
      properties:
        name:
          type: string
        size:
          type: integer
          description: Bytes.
        lines:
          type: integer
    CaptureListing:
      type: object
      required:
      - dir
      - files
      - enabled
      properties:
        dir:
          type: string
          description: Configured capture directory (empty when none)
        files:
          type: array
          items:
            $ref: '#/components/schemas/CaptureFile'
        enabled:
          type: boolean
          description: Whether capture mode is currently on.
    CaptureRead:
      type: object
      required:
      - records
      - total
      properties:
        records:
          type: array
          description: 'One entry per non-blank tail line: the json.loads result (any JSON value), or
            an object with a single raw key when the line is not valid JSON.'
          items: {}
        total:
          type: integer
          description: Total line count of the file.
    DeferredFeed:
      type: object
      required:
      - id
      - a1
      - a2
      - fire_at
      properties:
        id:
          type: string
        a1:
          type: integer
        a2:
          type: integer
        fire_at:
          type: number
          description: Unix timestamp
    DeferredFeedCreateRequest:
      type: object
      required:
      - date
      - time
      properties:
        date:
          type: string
          description: YYYY-MM-DD in the device timezone
        time:
          type: string
          description: HH:MM in the device timezone
        a1:
          type: integer
          default: 0
        a2:
          type: integer
          default: 0
    DeferredFeedCreateResult:
      type: object
      required:
      - ok
      - feed
      properties:
        ok:
          type: boolean
        feed:
          $ref: '#/components/schemas/DeferredFeed'
    DeferredFeedList:
      type: object
      required:
      - deferred
      properties:
        deferred:
          type: array
          items:
            $ref: '#/components/schemas/DeferredFeed'
    DeviceAction:
      type: object
      required:
      - key
      - name
      - destructive
      properties:
        key:
          type: string
        name:
          type: string
        destructive:
          type: boolean
    DeviceAiRequest:
      type: object
      properties:
        ai_enabled:
          type: boolean
    DeviceAiResult:
      type: object
      required:
      - ok
      - ai_enabled
      properties:
        ok:
          type: boolean
        ai_enabled:
          type: boolean
    DeviceAiView:
      type: object
      required:
      - supports_ai
      - ai_enabled
      properties:
        supports_ai:
          type: boolean
        ai_enabled:
          type: boolean
    DeviceBleChild:
      type: object
      required:
      - id
      - type
      - mac
      properties:
        id:
          type: integer
        type:
          type: string
        mac:
          type: string
    DeviceCapabilitiesRequest:
      description: Any subset of capability flags; unknown keys are ignored
      type: object
      properties:
        fullVideo:
          type: boolean
        eventImage:
          type: boolean
        highLight:
          type: boolean
        dynamicVideo:
          type: boolean
    DeviceCapabilitiesResult:
      type: object
      required:
      - ok
      - capabilities
      properties:
        ok:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilityFlags'
    DeviceCapabilitiesView:
      type: object
      required:
      - is_camera
      - capabilities
      properties:
        is_camera:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/DeviceCapabilityFlags'
    DeviceCapabilityFlags:
      type: object
      required:
      - fullVideo
      - eventImage
      - highLight
      - dynamicVideo
      properties:
        fullVideo:
          type: boolean
        eventImage:
          type: boolean
        highLight:
          type: boolean
        dynamicVideo:
          type: boolean
    DeviceCommandRequest:
      description: One of three forms, checked in order. action wins over entity, entity over suffix+payload.
        The raw suffix+payload form requires step-up.
      type: object
      properties:
        action:
          type: string
          description: Named button action available on this model
        entity:
          type: string
          description: Entity key
        value:
          description: Value for an entity write; stringified before use
        suffix:
          type: string
          description: Raw service suffix
        payload:
          description: Raw envelope published verbatim
        transport:
          type: string
          default: auto
          description: auto uses MQTT when the device has a live MQTT session and the bridge is connected,
            else the heartbeat queue. mqtt tries MQTT whenever the bridge has a live client (it does not
            check the device session) and falls back to the heartbeat queue when there is no live bridge
            or the publish fails. Any other value (for example heartbeat) queues for the next heartbeat.
            The response `delivered` reports what actually happened.
    DeviceCommandResult:
      description: Either a delivery result or a local-only result
      oneOf:
      - $ref: '#/components/schemas/DeviceDeliveryResult'
      - type: object
        required:
        - ok
        - delivered
        properties:
          ok:
            type: boolean
          delivered:
            type: string
            enum:
            - local
          action:
            type: string
            description: Present for action writes
          entity:
            type: string
            description: Present for entity writes
    DeviceDeleteResult:
      type: object
      required:
      - ok
      - removed
      - orphaned_accessories
      - note
      properties:
        ok:
          type: boolean
        removed:
          type: integer
        orphaned_accessories:
          type: array
          items:
            type: integer
        note:
          type: string
    DeviceDeliveryResult:
      type: object
      required:
      - ok
      - delivered
      - suffix
      - envelope
      properties:
        ok:
          type: boolean
        delivered:
          type: string
          enum:
          - mqtt
          - heartbeat-queue
        suffix:
          type: string
        envelope:
          description: Envelope sent to the device
          type:
          - object
          - string
          - array
          - number
          - boolean
          - 'null'
          additionalProperties: true
    DeviceDetail:
      description: Every DeviceSummary key (except that entities is an array here, not a count) plus the
        detail-only keys. Client-redacted.
      type: object
      required:
      - id
      - type
      - name
      - sn
      - mac
      - firmware
      - online
      - mqtt_connected
      - is_camera
      - is_feeder
      - supports_ai
      - pk
      - dn
      - last_heartbeat
      - last_state_report
      - last_seen
      - last_mqtt
      - mqtt_subscriptions
      - mqtt_delivery
      - queue
      - http_count
      - mqtt_count
      - ble
      - state
      - settings
      - config
      - diag
      - streams
      - schedules
      - entities
      - actions
      - timezoneInfo
      - logInfo
      properties:
        id:
          type: integer
        type:
          type: string
        name:
          type: string
        sn:
          type: string
        mac:
          type: string
        firmware:
          type: string
        online:
          type: boolean
        mqtt_connected:
          type: boolean
        is_camera:
          type: boolean
        is_feeder:
          type: boolean
        supports_ai:
          type: boolean
        pk:
          type: string
          description: MQTT product key
        dn:
          type: string
          description: MQTT device name
        last_heartbeat:
          description: Timestamp as stored by the device model
          type:
          - number
          - string
          - 'null'
        last_state_report:
          description: Timestamp as stored by the device model
          type:
          - number
          - string
          - 'null'
        last_seen:
          description: Timestamp as stored by the device model
          type:
          - number
          - string
          - 'null'
        last_mqtt:
          description: Timestamp as stored by the device model
          type:
          - number
          - string
          - 'null'
        mqtt_subscriptions:
          type: array
          items:
            type: string
        mqtt_delivery:
          description: What the broker would deliver; null when the broker is not running
          type:
          - object
          - 'null'
          additionalProperties: true
        queue:
          type: integer
          description: Pending heartbeat commands
        http_count:
          type: integer
        mqtt_count:
          type: integer
        ble:
          type: array
          items:
            $ref: '#/components/schemas/DeviceBleChild'
        state:
          description: Device-reported state blob; keys vary by model
          type:
          - object
          - 'null'
          additionalProperties: true
        settings:
          type: object
          additionalProperties: true
        config:
          description: Stored device config without settings; keys vary
          type: object
          additionalProperties: true
        diag:
          description: 'Hub diagnostics: {} for a device never seen, else http_count and mqtt_count plus
            last_* keys once recorded.'
          type: object
          additionalProperties: true
        streams:
          description: Stream URLs; empty until a probe confirms the device is serving
          type: object
          additionalProperties: true
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/DeviceScheduleTarget'
        entities:
          type: array
          items:
            $ref: '#/components/schemas/DeviceEntity'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/DeviceAction'
        capInfo:
          description: Null unless the device is a camera
          oneOf:
          - $ref: '#/components/schemas/DeviceCapabilitiesView'
          - type: 'null'
        timezoneInfo:
          $ref: '#/components/schemas/DeviceTimezoneView'
        logInfo:
          $ref: '#/components/schemas/DeviceLogSettings'
        aiInfo:
          description: Null unless the device supports AI
          oneOf:
          - $ref: '#/components/schemas/DeviceAiView'
          - type: 'null'
    DeviceEntity:
      type: object
      required:
      - component
      - key
      - name
      - value_path
      - unit
      - device_class
      - icon
      - options
      - option_values
      - settable
      - entity_category
      - min
      - max
      - step
      - value
      properties:
        component:
          type: string
        key:
          type: string
        name:
          type: string
        value_path:
          type: string
        unit:
          type:
          - string
          - 'null'
        device_class:
          type:
          - string
          - 'null'
        icon:
          type:
          - string
          - 'null'
        options:
          type:
          - array
          - 'null'
          items: {}
        option_values:
          type:
          - object
          - array
          - 'null'
          additionalProperties: true
        settable:
          type: boolean
        entity_category:
          type:
          - string
          - 'null'
        min:
          type:
          - number
          - 'null'
        max:
          type:
          - number
          - 'null'
        step:
          type:
          - number
          - 'null'
        value:
          description: Resolved current value, any JSON type
    DeviceLogFile:
      type: object
      required:
      - rel
      - name
      - device
      - size
      - mtime
      properties:
        rel:
          type: string
          description: Path relative to the log root (slash-separated)
        name:
          type: string
        device:
          type:
          - integer
          - 'null'
          description: First path segment parsed as device id.
        size:
          type: integer
        mtime:
          type: number
          description: Epoch seconds.
    DeviceLogListing:
      type: object
      required:
      - dir
      - reason
      - enabled_devices
      - files
      - total_bytes
      properties:
        dir:
          type: string
        reason:
          type: string
          description: Machine-readable token for why no logs can arrive right now.
        enabled_devices:
          type: array
          items:
            type: integer
