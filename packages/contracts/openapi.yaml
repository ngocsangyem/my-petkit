      type: object
      description: Media files by role (shared/media_slots.py). Every *_url value and every entry of waste
        and health is a path relative to the media root, not a URL (see _rel_media). A client builds the
        link by prefixing api/media/ (or api/media/thumb/ for a thumbnail) to the path, relative to its
        base URL.
      required:
      - highlight_url
      - playback_url
      - preview_url
      - poster_url
      - waste
      - health
      - snapshot_url
      - video_pending
      properties:
        highlight_url:
          type:
          - string
          - 'null'
        playback_url:
          type:
          - string
          - 'null'
        preview_url:
          type:
          - string
          - 'null'
        poster_url:
          type:
          - string
          - 'null'
        waste:
          type: array
          items:
            type: string
        health:
          type: array
          items:
            type: string
        snapshot_url:
          type:
          - string
          - 'null'
        video_pending:
          type: boolean
    TimelineSession:
      type: object
      required:
      - kind
      - id
      - related_event
      - device_id
      - device_name
      - ts
      - display_ts
      - pet_id
      - event_type
      - pet_name
      - pet_photo_url
      - label
      - event_kind
      - duration_sec
      - weight
      - bits
      - sub_events
      - media
      properties:
        kind:
          type: string
          description: Either visit or event.
        id:
          type:
          - integer
          - string
          - 'null'
        related_event:
          type:
          - string
          - integer
          - 'null'
        device_id:
          type:
          - integer
          - 'null'
        device_name:
          type: string
          description: Empty when the device is unregistered.
        ts:
          type:
          - number
          - 'null'
        display_ts:
          type:
          - number
          - 'null'
          description: When to show the card (visit entry time).
        pet_id:
          type:
          - integer
          - 'null'
        event_type:
          type:
          - string
          - integer
          - 'null'
        pet_name:
          type:
          - string
          - 'null'
        pet_photo_url:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
          description: Null for visits.
        event_kind:
          type:
          - string
          - 'null'
        duration_sec:
          type:
          - number
          - 'null'
        weight:
          type:
          - number
          - 'null'
        bits:
          type: array
          items:
            type: string
        sub_events:
          type: array
          items:
            $ref: '#/components/schemas/TimelineSubEvent'
        media:
          $ref: '#/components/schemas/TimelineMediaSlots'
    TimelineSubEvent:
      type: object
      required:
      - id
      - event_type
      - ts
      - label
      - detail
      properties:
        id:
          type:
          - integer
          - 'null'
        event_type:
          type:
          - string
          - integer
          - 'null'
        ts:
          type:
          - number
          - 'null'
        label:
          type:
          - string
          - 'null'
        detail:
          type: boolean
          description: Low-level step the UI collapses.
        media:
          anyOf:
          - $ref: '#/components/schemas/TimelineMediaSlots'
          - type: 'null'
  responses:
    Error:
      description: The error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
