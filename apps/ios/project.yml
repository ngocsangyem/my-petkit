# XcodeGen spec (`brew install xcodegen`, then `xcodegen generate` in apps/ios).
# The generated MyPetkit.xcodeproj is not committed.
name: MyPetkit
options:
  bundleIdPrefix: dev.mypetkit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  PetkitKit:
    path: PetkitKit
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6
targets:
  MyPetkit:
    type: application
    platform: iOS
    sources:
      - path: MyPetkit
        excludes:
          - "Config/*.xcconfig.example"
    dependencies:
      - package: PetkitKit
        product: PetkitCore
      - package: PetkitKit
        product: PetkitAPI
      - package: PetkitKit
        product: PetkitBLE
      - package: PetkitKit
        product: PetkitLive
    configFiles:
      Debug: MyPetkit/Config/Signing.xcconfig
      Release: MyPetkit/Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mypetkit.app
        INFOPLIST_FILE: MyPetkit/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  MyPetkitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MyPetkitTests]
    dependencies:
      - target: MyPetkit
      - package: PetkitKit
        product: PetkitCore
      - package: PetkitKit
        product: PetkitBLE
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MyPetkit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MyPetkit"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MyPetkit:
    build:
      targets:
        MyPetkit: all
        MyPetkitTests: [test]
    test:
      targets: [MyPetkitTests]
